services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crmuni-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - crmuni-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: crmuni.ui.api
    container_name: crmuni-api
    build:
      context: .
      dockerfile: CRMUNI.UI.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: Server=db,1433;Database=${DB_NAME};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      TokenJWT__SecretKeyJWT: ${JWT_SECRET_KEY}
      Auth__Pepper: ${AUTH_PEPPER}
    ports:
      - "${API_PORT}:8080"
    networks:
      - default
      - financ-network

  # Chat em tempo real (SignalR, /hubs/chat). No tunel do Cloudflare: hostname do chat -> http://crmuni-chat:8080
  chat:
    image: crmuni.ui.chat
    container_name: crmuni-chat
    build:
      context: .
      dockerfile: CRMUNI.UI.Chat/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # A api aplica as migrations ao subir; o chat so usa o banco.
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: Server=db,1433;Database=${DB_NAME};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      # Mesma chave da api: o chat valida o JWT emitido por ela.
      TokenJWT__SecretKeyJWT: ${JWT_SECRET_KEY}
      Auth__Pepper: ${AUTH_PEPPER}
    ports:
      - "${CHAT_PORT:-5090}:8080"
    networks:
      - default
      - financ-network

networks:
  # Rede da outra API, onde roda o cloudflared que expoe o tunel
  financ-network:
    external: true
    name: ${TUNNEL_NETWORK:-financ-network}

volumes:
  crmuni-db-data:
